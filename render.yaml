# Render Blueprint — one click deploys the app + a PostgreSQL database.
#   Render dashboard → New → Blueprint → pick this repo → Apply.
# Native Node runtime (same commands as local: npm run setup / npm start). A Dockerfile is also provided for other hosts.
services:
  - type: web
    name: dealflow360
    runtime: node
    plan: free
    region: singapore          # change to oregon / frankfurt if your judges are elsewhere
    buildCommand: npm run setup
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22.12.0"
      - key: DATABASE_URL
        fromDatabase:
          name: dealflow360-db
          property: connectionString
      - key: COOKIE_SECURE
        value: "1"
      - key: NODE_ENV
        value: production

databases:
  - name: dealflow360-db
    plan: free
    region: singapore
    databaseName: dealflow360
    user: dealflow
